<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Neeed</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif;
    background: radial-gradient(70% 60% at 0% 0%, #fde3cf 0%, transparent 60%), radial-gradient(60% 70% at 100% 20%, #dde9fb 0%, transparent 65%), #f5f3f1; color: #111318; }
  .card { background: #fff; border: 1px solid #e6e7eb; border-radius: 28px; padding: 32px; max-width: 320px; text-align: center; box-shadow: 0 12px 32px -16px rgba(17,19,24,.14); }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  p { color: #5d6270; margin: 0 0 20px; line-height: 1.5; }
  button { background: #111318; color: #fff; border: 0; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Neeed needs the internet to show your clinic. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
